<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Trois outils de décision pour Product Managers : classer une idée, choisir un artefact de discovery, choisir un type de prototype." />
  <title>PM Tool Project · Outils de décision produit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234b3ff2'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-style='italic' fill='white' text-anchor='middle'%3Ep%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hub.css" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="dfd0de73-55e0-431f-9af0-35eafc70c4fd"></script>
</head>
<body>
  <header class="hub-header">
    <a href="index.html" class="hub-logo"><span class="mark">pm</span>Tool<em>Kit</em></a>
    <nav class="hub-header-nav">
      <a href="faq.html" id="hub-nav-faq">FAQ</a>
      <span class="hub-header-note" id="hub-header-note"></span>
    </nav>
  </header>

  <section class="hub-hero">
    <span class="hub-eyebrow"><span class="dot"></span><span id="hub-eyebrow"></span></span>
    <h1 class="hub-title" id="hub-title"></h1>
    <p class="hub-intro" id="hub-intro"></p>
  </section>

  <main class="hub-showcase">
    <a class="tool-row" href="idea-classifier.html" style="--row-color: var(--tool-idea); --row-soft: var(--tool-idea-soft);">
      <div class="tool-row-visual">
        <span class="tool-row-number">01</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.05V17h6v-2.25c0-.85.4-1.55 1-2.05A7 7 0 0 0 12 2z"/></svg>
      </div>
      <div class="tool-row-body">
        <div class="tool-row-meta">
          <span class="tool-row-kicker" id="tool-idea-kicker"></span>
          <span class="tool-row-time" id="tool-idea-time"></span>
        </div>
        <h2 id="tool-idea-title"></h2>
        <p id="tool-idea-description"></p>
        <span class="tool-row-footer"><span id="tool-idea-cta"></span> <span class="arrow">→</span></span>
      </div>
    </a>

    <a class="tool-row" href="discovery-advisor.html" style="--row-color: var(--tool-discovery); --row-soft: var(--tool-discovery-soft);">
      <div class="tool-row-visual">
        <span class="tool-row-number">02</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div class="tool-row-body">
        <div class="tool-row-meta">
          <span class="tool-row-kicker" id="tool-discovery-kicker"></span>
          <span class="tool-row-time" id="tool-discovery-time"></span>
        </div>
        <h2 id="tool-discovery-title"></h2>
        <p id="tool-discovery-description"></p>
        <span class="tool-row-footer"><span id="tool-discovery-cta"></span> <span class="arrow">→</span></span>
      </div>
    </a>

    <a class="tool-row" href="proto-advisor.html" style="--row-color: var(--tool-proto); --row-soft: var(--tool-proto-soft);">
      <div class="tool-row-visual">
        <span class="tool-row-number">03</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H9.5a1 1 0 0 0-1 1v2.34a1 1 0 0 1-.35.76 8 8 0 1 0 10.7 0 1 1 0 0 1-.35-.76V3a1 1 0 0 0-1-1Z"/><path d="M8.5 2h7"/></svg>
      </div>
      <div class="tool-row-body">
        <div class="tool-row-meta">
          <span class="tool-row-kicker" id="tool-proto-kicker"></span>
          <span class="tool-row-time" id="tool-proto-time"></span>
        </div>
        <h2 id="tool-proto-title"></h2>
        <p id="tool-proto-description"></p>
        <span class="tool-row-footer"><span id="tool-proto-cta"></span> <span class="arrow">→</span></span>
      </div>
    </a>
  </main>

  <p class="hub-pipeline" id="hub-pipeline"></p>

  <footer class="hub-footer" id="hub-footer"></footer>

  <script src="js/core/i18n.js"></script>
  <script>
    (function () {
      var i18n = window.PMTool.core.i18n;
      document.documentElement.lang = i18n.getLang();
      i18n.mountLangToggle();
      i18n.loadLocale(i18n.getLang()).then(function (dict) {
        var t = dict.hub;
        document.getElementById('hub-nav-faq').textContent = t.navFaq;
        document.getElementById('hub-header-note').textContent = t.headerNote;
        document.getElementById('hub-eyebrow').textContent = t.eyebrow;
        document.getElementById('hub-title').innerHTML = t.titleHtml;
        document.getElementById('hub-intro').textContent = t.intro;
        document.getElementById('hub-pipeline').innerHTML = t.pipelineHtml;
        document.getElementById('hub-footer').textContent = t.footer;
        ['idea', 'discovery', 'proto'].forEach(function (id) {
          var tool = t.tools[id];
          document.getElementById('tool-' + id + '-kicker').textContent = tool.kicker;
          document.getElementById('tool-' + id + '-time').textContent = tool.time;
          document.getElementById('tool-' + id + '-title').textContent = tool.title;
          document.getElementById('tool-' + id + '-description').textContent = tool.description;
          document.getElementById('tool-' + id + '-cta').textContent = tool.cta;
        });
      });
    })();
  </script>
</body>
</html>
