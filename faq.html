<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Questions fréquentes sur PM Tool Project : confidentialité, méthode, utilité pour un PM senior, contribution." />
  <title>FAQ · PM Tool Project</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234b3ff2'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-style='italic' fill='white' text-anchor='middle'%3Ep%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/hub.css" />
  <link rel="stylesheet" href="css/faq.css" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="dfd0de73-55e0-431f-9af0-35eafc70c4fd"></script>
</head>
<body>
  <header class="hub-header">
    <a href="index.html" class="hub-logo"><span class="mark">pm</span>Tool<em>Kit</em></a>
    <a href="index.html" class="back-link" id="faq-back-link"></a>
  </header>

  <section class="hub-hero faq-hero">
    <span class="hub-eyebrow"><span class="dot"></span><span id="faq-eyebrow"></span></span>
    <h1 class="hub-title" id="faq-title"></h1>
    <p class="hub-intro" id="faq-intro"></p>
  </section>

  <main class="faq-list" id="faq-list"></main>

  <footer class="hub-footer" id="faq-footer"></footer>

  <script src="js/core/i18n.js"></script>
  <script>
    (function () {
      var i18n = window.PMTool.core.i18n;
      document.documentElement.lang = i18n.getLang();
      i18n.mountLangToggle();
      i18n.loadLocale(i18n.getLang()).then(function (dict) {
        var t = dict.faq;
        document.getElementById('faq-back-link').textContent = t.backLink;
        document.getElementById('faq-eyebrow').textContent = t.eyebrow;
        document.getElementById('faq-title').innerHTML = t.titleHtml;
        document.getElementById('faq-intro').textContent = t.intro;
        document.getElementById('faq-footer').textContent = t.footer;

        var list = document.getElementById('faq-list');
        list.innerHTML = '';
        t.items.forEach(function (item, i) {
          var details = document.createElement('details');
          details.className = 'faq-item';
          if (i === 0) details.open = true;
          var summary = document.createElement('summary');
          summary.textContent = item.question;
          details.appendChild(summary);
          var answer = document.createElement('div');
          answer.className = 'faq-answer';
          answer.innerHTML = item.answerHtml;
          details.appendChild(answer);
          list.appendChild(details);
        });
      });
    })();
  </script>
</body>
</html>
